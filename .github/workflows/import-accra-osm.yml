name: Import Accra OSM road networks
on:
  workflow_dispatch:
  push:
    branches:
      - feature/osm-accra-central-lapaz-import
    paths:
      - '.github/workflows/import-accra-osm.yml'
      - 'accra-ride/scripts/import-osm-areas.js'
      - 'accra-ride/src/map/osm-import.js'
      - 'accra-ride/src/core/validators.js'
      - 'accra-ride/tests/osm-import.test.js'
      - 'accra-ride/tests/road-navigation.test.js'
permissions:
  contents: write
concurrency:
  group: accra-osm-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/osm-accra-central-lapaz-import
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download and build Accra Central and Lapaz road graphs
        id: import
        continue-on-error: true
        run: |
          mkdir -p accra-ride/data/osm
          node accra-ride/scripts/import-osm-areas.js 2>&1 | tee accra-ride/data/osm/import.log
          exit ${PIPESTATUS[0]}
      - name: Run OSM import and directed-navigation tests
        id: tests
        if: steps.import.outcome == 'success'
        continue-on-error: true
        run: |
          node --test accra-ride/tests/osm-import.test.js accra-ride/tests/road-navigation.test.js 2>&1 | tee accra-ride/data/osm/test-results.txt
          exit ${PIPESTATUS[0]}
      - name: Save import diagnostics (and networks only after full validation)
        if: always()
        env:
          IMPORT_OUTCOME: ${{ steps.import.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add accra-ride/data/osm/import-report.json
          if [ "$IMPORT_OUTCOME" = "success" ] && [ "$TEST_OUTCOME" = "success" ]; then
            git add accra-ride/data/osm/*.network.json accra-ride/data/osm/test-results.txt
          fi
          if ! git diff --cached --quiet; then
            git commit -m "Record Accra OSM import diagnostics and validated networks"
            git push origin HEAD:feature/osm-accra-central-lapaz-import
          fi
      - name: Fail if import or tests did not pass
        if: steps.import.outcome != 'success' || steps.tests.outcome != 'success'
        run: exit 1
