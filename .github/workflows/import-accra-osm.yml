name: Import Accra OSM road networks
# Shared bidirectional lanes are now valid in the canonical road graph schema.
on:
  workflow_dispatch:
  push:
    branches:
      - feature/osm-accra-central-lapaz-import
      - fix/road-lanes-surface-and-map-previews
      - feature/phase1-osm-reextract-minimap-fix
      - feature/rd-02-lane-architecture
      - feature/lapaz-ten-road-circuit
    paths:
      - '.github/workflows/import-accra-osm.yml'
      - 'accra-ride/scripts/import-osm-areas.js'
      - 'accra-ride/scripts/build-highway-corridor.js'
      - 'accra-ride/data/osm/lapaz-madina-waypoints.json'
      - 'accra-ride/tests/build-highway-corridor.test.js'
      - 'accra-ride/scripts/analyze-racing-circuits.js'
      - 'accra-ride/scripts/audit-road-lanes.js'
      - 'accra-ride/scripts/audit-osm-networks.js'
      - 'accra-ride/src/map/osm-import.js'
      - 'accra-ride/src/map/road-lane-classification.js'
      - 'accra-ride/tests/road-lane-classification.test.js'
      - 'accra-ride/src/map/road-navigation.js'
      - 'accra-ride/src/map/road-network-reducer.js'
      - 'accra-ride/tests/road-network-reducer.test.js'
      - 'accra-ride/src/map/three-road-renderer.js'
      - 'accra-ride/src/map/road-network-runtime.js'
      - 'accra-ride/src/map/selected-road-graph.js'
      - 'accra-ride/src/ui/phase-2-navigation.js'
      - 'accra-ride/src/ui/standalone-game-hud.js'
      - 'accra-ride/accrarush.html'
      - 'accra-ride/src/core/validators.js'
      - 'accra-ride/tests/osm-import.test.js'
      - 'accra-ride/tests/analyze-racing-circuits.test.js'
      - 'accra-ride/tests/road-navigation.test.js'
      - 'accra-ride/tests/road-network-game-integration.test.js'
      - 'accra-ride/tests/three-road-renderer.test.js'
      - 'accra-ride/tests/real-osm-runtime.test.js'
      - 'accra-ride/tests/selected-road-graph.test.js'
permissions:
  contents: write
concurrency:
  group: accra-osm-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Osmium
        run: |
          sudo apt-get update
          sudo apt-get install --yes osmium-tool
          osmium --version
      - name: Determine daily Geofabrik snapshot cache key
        id: pbf-date
        run: echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - name: Restore cached Geofabrik Ghana PBF
        id: pbf-cache
        uses: actions/cache@v4
        with:
          path: accra-ride/data/osm/ghana-latest.osm.pbf
          key: ghana-osm-pbf-${{ steps.pbf-date.outputs.date }}-v1
      - name: Download and verify Geofabrik Ghana PBF
        if: steps.pbf-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p accra-ride/data/osm
          curl --fail --location --retry 12 --retry-all-errors --retry-delay 10 \
            --connect-timeout 30 --max-time 1800 \
            https://download.geofabrik.de/africa/ghana-latest.osm.pbf \
            --output accra-ride/data/osm/ghana-latest.osm.pbf
      - name: Verify PBF integrity and source timestamp
        run: |
          test -s accra-ride/data/osm/ghana-latest.osm.pbf
          osmium fileinfo accra-ride/data/osm/ghana-latest.osm.pbf
      - name: Save verified Geofabrik PBF cache even when later audits fail
        if: always() && steps.pbf-cache.outputs.cache-hit != 'true' && hashFiles('accra-ride/data/osm/ghana-latest.osm.pbf') != ''
        uses: actions/cache/save@v4
        with:
          path: accra-ride/data/osm/ghana-latest.osm.pbf
          key: ghana-osm-pbf-${{ steps.pbf-date.outputs.date }}-v1
      - name: Extract and build Accra Central and Lapaz road graphs
        id: import
        continue-on-error: true
        run: node accra-ride/scripts/import-osm-areas.js
      - name: Build the approved Lapaz–Madina point-to-point highway corridor
        id: route
        if: steps.import.outcome == 'success'
        continue-on-error: true
        run: node accra-ride/scripts/build-highway-corridor.js
      - name: Run OSM import and directed-navigation tests
        id: tests
        if: steps.import.outcome == 'success' && steps.route.outcome == 'success'
        continue-on-error: true
        run: |
          node --test accra-ride/tests/build-highway-corridor.test.js accra-ride/tests/selected-road-graph.test.js accra-ride/tests/real-osm-runtime.test.js accra-ride/tests/road-network-game-integration.test.js accra-ride/tests/osm-import.test.js accra-ride/tests/road-lane-classification.test.js accra-ride/tests/road-network-reducer.test.js accra-ride/tests/road-navigation.test.js accra-ride/tests/road-network-game-integration.test.js accra-ride/tests/three-road-renderer.test.js accra-ride/tests/real-osm-runtime.test.js
      - name: Independently audit both generated road networks
        id: audit
        if: steps.import.outcome == 'success' && steps.tests.outcome == 'success'
        continue-on-error: true
        run: node accra-ride/scripts/audit-osm-networks.js
      - name: Independently audit RD-02 lane architecture
        id: lane-audit
        if: steps.import.outcome == 'success' && steps.tests.outcome == 'success' && steps.audit.outcome == 'success'
        continue-on-error: true
        run: node accra-ride/scripts/audit-road-lanes.js
      - name: Upload re-extracted OSM networks for route-level inspection
        if: steps.import.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: accrarush-osm-networks
          path: |
            accra-ride/data/osm/accra-central.network.json
            accra-ride/data/osm/lapaz.network.json
            accra-ride/data/osm/lapaz-routing.network.json
          if-no-files-found: error
          retention-days: 7
      - name: Save diagnostics and independently audited networks
        if: always()
        env:
          IMPORT_OUTCOME: ${{ steps.import.outcome }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
          LANE_AUDIT_OUTCOME: ${{ steps.lane-audit.outcome }}
          ROUTE_OUTCOME: ${{ steps.route.outcome }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f accra-ride/data/osm/import-report.json ]; then
            git add accra-ride/data/osm/import-report.json
          fi
          if [ -f accra-ride/data/osm/independent-validation-report.json ]; then
            git add accra-ride/data/osm/independent-validation-report.json
          fi
          if [ "$LANE_AUDIT_OUTCOME" = "success" ] && [ -f accra-ride/data/osm/lane-architecture-report.json ]; then
            git add accra-ride/data/osm/lane-architecture-report.json
          fi
          if [ "$IMPORT_OUTCOME" = "success" ] && [ "$TEST_OUTCOME" = "success" ] && [ "$AUDIT_OUTCOME" = "success" ] && [ "$LANE_AUDIT_OUTCOME" = "success" ] && [ "$ROUTE_OUTCOME" = "success" ]; then
            git add accra-ride/data/osm/accra-central.network.json accra-ride/data/osm/lapaz.network.json accra-ride/data/osm/lapaz-madina-route.json
          fi
          # Keep failed/temporary generated outputs out of the commit while allowing
          # accepted reports and datasets to be committed and pushed safely.
          git stash push --include-untracked --keep-index -m "temporary OSM import outputs" || true
          if ! git diff --cached --quiet; then
            git commit -m "Import and independently audit Accra road networks"
            pushed=false
            for attempt in 1 2 3; do
              git fetch origin "${GITHUB_REF_NAME}"
              git rebase "origin/${GITHUB_REF_NAME}"
              if git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"; then
                pushed=true
                break
              fi
              git rebase --abort || true
              sleep 2
            done
            if [ "$pushed" != "true" ]; then
              echo "Could not publish the audited OSM outputs after three attempts"
              exit 1
            fi
          fi
          git stash drop || true
      - name: Fail if import, tests or independent audit did not pass
        if: steps.import.outcome != 'success' || steps.tests.outcome != 'success' || steps.audit.outcome != 'success' || steps.lane-audit.outcome != 'success' || steps.route.outcome != 'success'
        run: exit 1
