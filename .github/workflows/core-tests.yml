name: Accra Rush Core Tests

on:
  push:
    branches: [master]
    paths:
      - "accra-ride/src/core/**"
      - "accra-ride/tests/**"
      - "package.json"
      - ".github/workflows/core-tests.yml"
  pull_request:
    branches: [master]
    paths:
      - "accra-ride/src/core/**"
      - "accra-ride/tests/**"
      - "package.json"
      - ".github/workflows/core-tests.yml"
      - "accra-ride/scripts/import-osm-areas.js"
      - "accra-ride/src/map/osm-import.js"
      - ".github/workflows/import-accra-osm.yml"

permissions:
  contents: write

jobs:
  core-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test

  osm-import:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download and build Accra Central and Lapaz road graphs
        run: node accra-ride/scripts/import-osm-areas.js
      - name: Run OSM import and directed-navigation contract tests
        run: node --test accra-ride/tests/osm-import.test.js accra-ride/tests/road-navigation.test.js
      - name: Commit imported OSM data to feature branch
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add accra-ride/data/osm/*.network.json
          if ! git diff --cached --quiet; then
            git commit -m "Import tiled OSM road networks for Accra Central and Lapaz"
            git push origin "HEAD:${BRANCH_NAME}"
          fi
