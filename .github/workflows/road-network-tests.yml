name: Road network contract tests

on:
  pull_request:
    paths:
      - "accra-ride/src/core/road-network.js"
      - "accra-ride/src/world/roads/**"
      - "accra-ride/src/world/navigation/**"
      - "accra-ride/src/world/traffic/**"
      - "accra-ride/scripts/import-osm-road-areas.mjs"
      - "accra-ride/data/roads/**"
      - "accra-ride/tests/**"
      - "package.json"
      - ".github/workflows/road-network-tests.yml"
  push:
    branches: [master, feat/phase-4-road-network-core]
    paths:
      - "accra-ride/src/core/road-network.js"
      - "accra-ride/src/world/roads/**"
      - "accra-ride/src/world/navigation/**"
      - "accra-ride/src/world/traffic/**"
      - "accra-ride/data/roads/**"
      - "accra-ride/tests/**"
      - "package.json"

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test accra-ride/tests/road-network.test.js accra-ride/tests/osm-road-import.test.js accra-ride/tests/road-data.test.js accra-ride/tests/road-geometry.test.js accra-ride/tests/road-network-renderer.test.js accra-ride/tests/navigation-traffic.test.js accra-ride/tests/road-map-model.test.js accra-ride/tests/minimap-check.test.js accra-ride/tests/osm-fixture-identity.test.js
